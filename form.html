<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <a href="./index.html">My Profile</a>
</head>
<body>
    <h2>Sign up</h2>
<p>Create an account to get started on your learning journey</p>
<form>
    <label>Email</label>
    <br/>
     <input type="email" placeholder="john.doe@example.com"/>
     <br/>
    <label>First name</label>
    <br/>
     <input type="text" placeholder="john"/>
     <br/>
    <label>Last name</label>
    <br/>
     <input type="text" placeholder="doe"/>
     <br/>
    <label>Phone number</label>
    <br/>
     <input type="number" placeholder="+1234567890"/>
     <br/>
     <label>Password</label>
    <br/>
     <input type="password" placeholder="********"/>
</form>
<p>By clicking Create account, I agree to <font color="blue">Terms of Use</font> and acknowledge that 
    I have read the <font color="blue">Privacy Policy.</font> </p>
<button>Create account</button>
<br/>
<p>OR</p>
<button>Login with Google</button>
</body>
